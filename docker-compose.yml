services:
  data_service:
    build: ./data_service
    container_name: stock_data_service
    ports:
      - "8001:${DATA_SERVICE_PORT}"
    environment:
      DB_PATH: ${DB_PATH}
    volumes:
      - stock_data:/app/data
    restart: unless-stopped

  processing_service:
    build: ./processing_service
    container_name: stock_processing_service
    ports:
      - "${PROCESSING_SERVICE_PORT}:${PROCESSING_SERVICE_PORT}"
    environment:
      API_URL: ${API_URL}
    depends_on:
      - data_service
    restart: unless-stopped

volumes:
  stock_data: