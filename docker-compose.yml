services:
  data_service:
    build: ./data_service
    ports:
      - "8001:8000"
    environment:
      DB_PATH: /app/data_service/stock.db
    volumes:
      - ./data_service:/app/data_service

  processing_service:
    build: ./processing_service
    container_name: stock_processing_service
    ports:
      - "${PROCESSING_SERVICE_PORT}:${PROCESSING_SERVICE_PORT}"
    environment:
      API_URL: ${API_URL}
    depends_on:
      - data_service
    restart: unless-stopped

  report_service:
    build: ./report_service
    container_name: stock_report_service
    ports:
      - "8002:8002"
    environment:
      - DATA_SERVICE_URL=http://data_service:8000
      - PROCESSING_SERVICE_URL=http://stock_processing_service:${PROCESSING_SERVICE_PORT}
    depends_on:
      - data_service
      - processing_service
    restart: unless-stopped

volumes:
  stock_data: